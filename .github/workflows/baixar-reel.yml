name: Baixar e Analisar Reel

# Manual (workflow_dispatch). Roda no runner do GitHub, que tem internet aberta,
# para baixar um Reel do Instagram, extrair quadros, transcrever o audio e
# commitar os resultados de volta no branch para analise.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL do reel do Instagram"
        required: true
        default: "https://www.instagram.com/reel/Dai-28hJEWi/"
  push:
    branches: [claude/instagram-reel-review-aprox4]
    paths: [".github/reel-trigger"]

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/instagram-reel-review-aprox4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp openai-whisper

      - name: Baixar reel
        run: |
          set -o pipefail
          mkdir -p reels_baixados/out
          rm -f reels_baixados/out/* || true
          URL="${{ github.event.inputs.url }}"
          if [ -z "$URL" ] && [ -f .github/reel-trigger ]; then
            URL="$(head -n1 .github/reel-trigger | tr -d '[:space:]')"
          fi
          echo "URL alvo: $URL"
          if yt-dlp -f "bv*+ba/b" --merge-output-format mp4 --write-info-json \
               --no-playlist -o "reels_baixados/out/reel.%(ext)s" \
               "$URL" 2>&1 | tee reels_baixados/out/ytdlp.log; then
            echo "DOWNLOAD_OK=1" >> "$GITHUB_ENV"
          else
            echo "DOWNLOAD_OK=0" >> "$GITHUB_ENV"
            echo "::warning::Download falhou — provavelmente login/rate-limit. Ver ytdlp.log."
          fi

      - name: Extrair quadros + audio
        if: env.DOWNLOAD_OK == '1'
        run: |
          cd reels_baixados/out
          ffmpeg -i reel.mp4 -vf "fps=1,scale=540:-1" -q:v 3 frame_%03d.jpg -hide_banner -loglevel error || true
          ffmpeg -i reel.mp4 -vn -acodec libmp3lame -q:a 4 audio.mp3 -hide_banner -loglevel error || true

      - name: Transcrever audio (Whisper large-v3)
        if: env.DOWNLOAD_OK == '1'
        run: |
          cd reels_baixados/out
          python - <<'PY'
          import whisper
          # large-v3: melhor precisao. initial_prompt injeta vocabulario de dominio
          # (juridico + IA) para reduzir erros como "aiada" -> "a IA da".
          prompt = (
              "Transcricao de reel sobre Visual Law e IA no Judiciario. "
              "Termos: IA da 2a instancia, IA do gabinete, IA dos tribunais superiores, "
              "PJE, peticao, jurisprudencia, prova-chave, argumento decisivo, recurso prolixo, "
              "violacao especifica, precedente aplicavel, requisito de admissibilidade, tese, "
              "recursos infaliveis, legal design, persuasao."
          )
          m = whisper.load_model("large-v3")
          r = m.transcribe("audio.mp3", language="pt", initial_prompt=prompt,
                           temperature=0.0, beam_size=5)
          open("transcricao.txt", "w", encoding="utf-8").write(r["text"].strip())
          print("Transcricao large-v3 OK")
          PY

      - name: Resumir metadados
        if: env.DOWNLOAD_OK == '1'
        run: |
          cd reels_baixados/out
          python - <<'PY'
          import json, glob, re
          fs = glob.glob("*.info.json")
          if fs:
              d = json.load(open(fs[0], encoding="utf-8"))
              desc = (d.get("description") or "").strip()
              tags = re.findall(r"#\w+", desc)
              open("metadados.txt", "w", encoding="utf-8").write(
                  f"URL......: {d.get('webpage_url')}\n"
                  f"Autor....: {d.get('uploader')} (@{d.get('uploader_id')})\n"
                  f"Duracao..: {d.get('duration')} s\n"
                  f"Likes....: {d.get('like_count')}\n"
                  f"Views....: {d.get('view_count')}\n"
                  f"Data.....: {d.get('upload_date')}\n\n"
                  f"LEGENDA:\n{desc or '(sem legenda)'}\n\n"
                  f"HASHTAGS:\n{' '.join(tags) if tags else '(nenhuma)'}\n"
              )
              print("Metadados OK")
          PY

      - name: Commitar resultados de volta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # nao versionar o mp4 pesado nem o audio; guardar quadros + textos + log
          rm -f reels_baixados/out/reel.mp4 reels_baixados/out/audio.mp3 || true
          git add -f reels_baixados/
          git commit -m "chore(reel): resultado do download/analise via CI [skip ci]" || echo "nada a commitar"
          for i in 1 2 3 4; do
            git push origin HEAD:claude/instagram-reel-review-aprox4 && break
            git pull --rebase origin claude/instagram-reel-review-aprox4 || true
            sleep $((2**i))
          done
