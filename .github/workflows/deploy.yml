name: Deploy to Hostinger (FTPS)

# Manual-only enquanto valida. Depois de 1 deploy OK, descomentar o bloco `push`
# abaixo para publicar automaticamente a cada push na master.
on:
  workflow_dispatch:
  # push:
  #   branches: [ master ]

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTPS (mirror, sem delete)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set ftp:prefer-epsv no;
            set net:max-retries 4;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            open -u \"$FTP_USER\",\"$FTP_PASS\" -p \"$FTP_PORT\" \"$FTP_HOST\";
            mirror -R --verbose --parallel=1 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .claude/ \
              --exclude-glob node_modules/ \
              --exclude-glob *.py \
              --exclude-glob *.bat \
              --exclude-glob *.zip \
              --exclude-glob webhook-deploy.php \
              --exclude-glob README.md \
              --exclude-glob ROTEIRO-REELS.md \
              --exclude-glob *.md \
              --exclude-glob diagnosticos/ \
              --exclude-glob portal/ \
              --exclude-glob data/ \
              --exclude-glob dashboard-data.json \
              --exclude-glob leads.html \
              --exclude-glob mission-control.html \
              --exclude-glob *-dashboard*.html \
              --exclude-glob auditoria-detalhe*.html \
              --exclude .gitignore \
              ./ /public_html/ ;
          "
