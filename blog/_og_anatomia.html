<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800;900&family=Fraunces:ital,opsz,wght@1,9..144,600&family=JetBrains+Mono:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1200px;height:630px;overflow:hidden}
.og{width:1200px;height:630px;display:flex;background:linear-gradient(135deg,#5e0f18,#7a1220 55%,#c41a1a);position:relative;overflow:hidden}
.og::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 84% 20%,rgba(255,255,255,.10),transparent 44%)}
.l{width:660px;padding:64px 46px 56px 64px;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.eye{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;color:#ffcf9e;letter-spacing:4px;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.eye::before{content:'';width:40px;height:3px;background:#e0864a}
h1{font-family:'Figtree',sans-serif;font-weight:900;font-size:66px;line-height:1.02;color:#fff;margin-top:22px;letter-spacing:-2px}
h1 em{font-family:'Fraunces',serif;font-style:italic;font-weight:600;color:#ffd9b0}
.sub{font-family:'Inter',sans-serif;font-size:23px;color:rgba(255,255,255,.9);margin-top:20px;max-width:520px;line-height:1.4}
.ft{display:flex;align-items:center;gap:14px}
.ft .lg{width:56px;height:56px;border-radius:50%;background:#fff;padding:5px}.ft .lg img{width:100%;height:100%;border-radius:50%;object-fit:contain}
.ft .fx{font-family:'Figtree',sans-serif;font-weight:800;font-size:23px;color:#fff}
.ft .fx small{display:block;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;color:rgba(255,255,255,.7);letter-spacing:2px;margin-top:2px}
.r{width:540px;display:flex;align-items:center;justify-content:center;z-index:2}
.mini{width:380px;background:#fff;border-radius:18px;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);overflow:hidden;transform:rotate(2deg)}
.mini .mh{background:#111;padding:13px 18px}.mini .mh .k{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#ffd9b0;letter-spacing:1.5px}.mini .mh h4{font-family:'Figtree',sans-serif;font-weight:800;font-size:19px;color:#fff;margin-top:2px}
.mini .mb{padding:16px 18px}
.row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;background:#faf9fa;border-left:5px solid;margin-bottom:8px}
.row .nm{width:22px;height:22px;border-radius:50%;background:#c41a1a;color:#fff;font-family:'Figtree',sans-serif;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 22px}
.row b{font-family:'Figtree',sans-serif;font-size:15px;color:#1a1a1a}
.r1{border-color:#c41a1a}.r2{border-color:#a5153f}.r3{border-color:#7a1220}.r4{border-color:#b8892a}.r5{border-color:#4a4a52}
</style></head><body>
<div class="og">
<div class="l">
  <div class="eye">Visual Law · Legal Design</div>
  <div><h1>Anatomia de uma pe&ccedil;a em <em>Visual Law</em></h1>
  <div class="sub">Linha do tempo, cabimento, fundamentos, dispositivos e pedido &mdash; cada elemento no lugar.</div></div>
  <div class="ft"><div class="lg"><img src="../images/logo.png"/></div><div class="fx">AUD&Iacute;PER<small>AUDITORES &amp; PERITOS</small></div></div>
</div>
<div class="r"><div class="mini">
  <div class="mh"><div class="k">RESUMO EXECUTIVO · 343-A</div><h4>Recurso Especial</h4></div>
  <div class="mb">
    <div class="row r1"><span class="nm">1</span><b>Linha do tempo</b></div>
    <div class="row r2"><span class="nm">2</span><b>Cabimento</b></div>
    <div class="row r3"><span class="nm">3</span><b>Fundamentos</b></div>
    <div class="row r4"><span class="nm">4</span><b>Dispositivos</b></div>
    <div class="row r5"><span class="nm">5</span><b>Pedido</b></div>
  </div>
</div></div>
</div></body></html>
