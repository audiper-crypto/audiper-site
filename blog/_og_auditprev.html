<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800;900&family=Fraunces:ital,opsz,wght@1,9..144,600&family=JetBrains+Mono:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1200px;height:630px;overflow:hidden}
.og{width:1200px;height:630px;position:relative;overflow:hidden;background:#0e0608}
.bgimg{position:absolute;inset:0;background:url("../images/contabil_1240_600.png") center/cover;opacity:.28}
.scrim{position:absolute;inset:0;background:linear-gradient(100deg,#0e0608 0%,#3a0610 34%,rgba(122,18,32,.72) 60%,rgba(220,38,38,.30) 100%)}
.glow{position:absolute;right:-60px;top:-80px;width:620px;height:620px;background:radial-gradient(circle,rgba(220,38,38,.42),transparent 62%)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;z-index:3}
.l{width:720px;padding:60px 40px 56px 66px;display:flex;flex-direction:column;justify-content:center;height:100%}
.eye{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;color:#e6b877;letter-spacing:5px;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.eye::before{content:'';width:44px;height:3px;background:#c9a962}
h1{font-family:'Figtree',sans-serif;font-weight:900;font-size:62px;line-height:1.04;color:#fff;margin-top:22px;letter-spacing:-1.5px}
h1 em{font-family:'Fraunces',serif;font-style:italic;font-weight:600;background:linear-gradient(90deg,#ff6a5b,#dc2626,#c9a962);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{margin-top:22px;font-family:'Fraunces',serif;font-style:italic;font-size:27px;color:#f0d9b0}
.foot{margin-top:26px;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:rgba(255,255,255,.82);letter-spacing:2px}
.foot small{display:block;color:rgba(255,255,255,.55);font-weight:400;font-size:13px;letter-spacing:1px;margin-top:3px}
.r{flex:1;display:flex;align-items:center;justify-content:center;z-index:3}
.lg{width:300px;height:300px;border-radius:50%;box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 0 8px rgba(201,169,98,.18)}
.lg img{width:100%;height:100%;object-fit:contain;border-radius:50%}
</style></head>
<body>
<div class="og">
  <div class="bgimg"></div><div class="scrim"></div><div class="glow"></div>
  <div class="wrap">
    <div class="l">
      <div class="eye">Auditoria Preventiva</div>
      <h1>Enxergue o risco <em>antes</em><br/>dele virar preju&iacute;zo.</h1>
      <div class="tag">Risco Mapeado, Risco Controlado.</div>
      <div class="foot">AUD&Iacute;PER &middot; AUDITORES INDEPENDENTES<small>CRC/PI 000023/O &middot; Desde 1989 &middot; audiper.com</small></div>
    </div>
    <div class="r"><div class="lg"><img src="../images/logo.png" alt="AUDIPER"/></div></div>
  </div>
</div></body></html>
