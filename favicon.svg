<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1e"/>
      <stop offset="100%" style="stop-color:#0a0a0c"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)" stroke="#ffffff" stroke-width="12"/>
  <!-- Letter A -->
  <g>
    <polygon points="256,100 370,390 330,390 290,270 222,270 182,390 142,390"
      fill="#ffffff" stroke="none"/>
    <rect x="200" y="280" width="112" height="30" fill="url(#bg)"/>
  </g>
  <!-- Checkmark -->
  <polyline points="230,320 275,370 370,220"
    fill="none" stroke="#DC2626" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>